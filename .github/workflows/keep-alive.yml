# Keeps the Render free tier warm between scheduled GitHub Actions runs.
# Render may still spin down because free-plan sleep behavior is platform-controlled.
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf "https://vibetalk.me/api/health" | head -c 500
          echo ""
          echo "Ping OK at $(date -u)"
