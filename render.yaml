# Render Blueprint — free tier, no credit card required
services:
  - type: web
    name: vibetalk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: REACT_APP_API_URL
        value: /api
      - key: REACT_APP_SOCKET_URL
        sync: false
      - key: REACT_APP_ADSENSE_CLIENT_ID
        value: ca-pub-5149550826483446
      - key: REACT_APP_ADSENSE_SLOT_CHAT_SIDEBAR
        value: "3906615674"
      - key: REACT_APP_ADSENSE_SLOT_RANDOM_MATCH_INLINE
        value: "3628542402"
      - key: REACT_APP_ADSENSE_SLOT_GROUP_CHAT_TOP
        value: "6888002231"
      - key: REACT_APP_ADSENSE_SLOT_USERS_LIST_BOTTOM
        value: "6352156478"
      - key: REACT_APP_ADSENSE_SLOT_PROFILE_BOTTOM
        value: "8184534352"
